<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轉向中⋯⋯｜馬偕通識分享區</title>
<meta name="robots" content="noindex">
<script>
// GitHub Pages 對未知路徑回這一頁。把路徑與 hash 保住再導回 app shell，
// 這樣分享出去的深層連結（例如 /c/HE139A-caiweimin）不會斷掉。
(function () {
  var l = window.location;
  var base = l.pathname.replace(/\/[^/]*$/, '/');
  var rest = l.pathname.slice(base.length).replace(/^\/+/, '');
  var target = base + (l.hash ? '' : (rest ? '#/' + rest : '')) + l.search + l.hash;
  l.replace(target || base);
})();
</script>
</head>
<body>
<p>轉向中⋯⋯如果沒有自動跳轉，<a href="./">請回首頁</a>。</p>
</body>
</html>
