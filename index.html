<!-- 社群預覽圖必須是完整網址：LINE、Facebook、Discord 的爬蟲不會執行 JS，
     也不會替相對路徑補上網域。圖是設計者 syaouei 畫的馬偕羊。 -->
<meta property="og:image" content="https://syaouei.github.io/mmu-general-course-v2/assets/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1728">
<meta property="og:image:height" content="972">
<meta property="og:image:alt" content="戴著紅色貝雷帽、穿 MMU 衣服的馬偕羊，旁邊寫著「通識上啥」">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<script>
// 在 CSS 之前套用記住的外觀設定，避免深色使用者先閃一下白畫面。
// 這件事一定要同步、在 <head> 裡做完，所以不能放進 js/theme.js（那是
// module，會被延後執行）。沒有記錄時什麼都不做 —— 沒有 data-theme
// 屬性就是「跟隨系統」，由 tokens.css 的 prefers-color-scheme 決定。
try {
  var t = localStorage.getItem('mmu:theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
} catch (e) { /* 私密視窗會擋 localStorage，跟隨系統即可 */ }
</script>
<!-- 字型要等 JS 把內容畫出來，瀏覽器才會發現需要它，晚到就會換字型、跳版面。
     兩個檔案每一頁都用得到（拉丁字母與數字），所以直接預載。
     檔名改了 CI 的連結檢查會擋下來。 -->
<link rel="preload" href="assets/fonts/archivo-400-700.woff2" as="font" type="font/woff2" crossorigin>
